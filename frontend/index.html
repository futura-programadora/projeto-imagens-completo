<!DOCTYPE html>
<html>
<head>
  <title>Upload de Imagens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Postar uma Imagem</h1>
  <form id="uploadForm">
    <input type="text" id="nome" placeholder="Seu nome" required><br>
    <input type="text" id="legenda" placeholder="Legenda" required><br>
    <!--O acept filtra o tipo de arquivo-->
    <input type="file" id="imagem" accept="image/*" required><br>
    <button type="submit">Enviar</button>
  </form>

  <h2>Imagens Publicadas:</h2>
  <div id="feed"></div>

  <script src="script.js"></script>
</body>
</html>
